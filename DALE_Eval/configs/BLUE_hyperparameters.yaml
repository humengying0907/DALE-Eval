# Default internal BLUE hyperparameters for the benchmark runner.
#
# The BLUE runner should load this file by default, merge these sections into
# the generated BLUE pipeline config, and then fill dataset-specific paths,
# scRNA schema fields, and cell-type mappings at runtime.
#
# To change BLUE's internal behavior for all benchmark runs, edit this file
# directly instead of passing long hyperparameter lists through --extra_args.
# Keep this file limited to BLUE pipeline options; benchmark paths and config_id
# selection still come from DALE_Eval/configs/deconv_configs.txt and
# benchmark_ref_assignment.txt.



# BLUE internal cell-type mapping.
#
# mapping_yaml controls the classes BLUE trains and predicts internally.
# - null: use the required default mapping under the independent reference
#   folder, e.g. Indep_scReference/<indep_ref>/celltype_mapping.yaml
# - path: use an absolute path or repo-relative path to an alternate BLUE
#   mapping YAML.
#
# This config value is the default. A run can override it with strict extra_args:
#   celltype_mapping_yaml=Indep_scReference/<indep_ref>/celltype_mapping_smoke6.yaml
#
# Note this is separate from benchmark export mapping. For collapsed smoke-test
# mappings, run with map_cell_types=false so outputs keep the collapsed names.
cell_types:
  mapping_yaml: null

# Gene-set behavior for BLUE.
#
# BLUE's own default is:
# - paths.input_gene_list: null  -> <gene_lists_dir>/all_DEG_lst.txt
# - paths.output_gene_list: null -> same as input_gene_list, therefore DEGs
#
# predict_gene_set is the benchmark-facing switch for CTSE export scope:
# - deg: predict/export genes in all_DEG_lst.txt only (BLUE default behavior)
# - common: predict/export all genes shared by scRNA reference and bulk input
#
# input_gene_set controls model input features:
# - null: keep BLUE default behavior, which resolves to DEGs
# - deg: explicit all_DEG_lst.txt
# - common: explicit all_common_gene_lst.txt
#
# pseudobulk_gene_set controls genes stored in step-02 pseudobulk h5ads:
# - auto: smallest valid set covering input_gene_set and predict_gene_set
# - deg: all_DEG_lst.txt
# - common: all_common_gene_lst.txt, matching BLUE's original step-02 behavior
#
# With training.preprocess_mode: deg_first and predict_gene_set: deg, auto uses
# DEG pseudobulks to avoid storing unused common genes in memory-heavy layers.
genes:
  predict_gene_set: deg
  input_gene_set: null
  pseudobulk_gene_set: auto

# Pseudobulk generation used for BLUE training.
pseudobulk:
  # Per-library train pseudobulks. Total per-library samples are
  # samplenum_per_ct * number_of_cell_types_present_in_that_library.
  samplenum_per_ct: 30

  # Per-library validation pseudobulks.
  val_samplenum_per_patient: 10

  # Additional pseudobulks generated by pooling cells across all libraries.
  samplenum_all_train: 3000
  samplenum_all_val: 300

  # Mean/target number of cells sampled into each pseudobulk.
  n_cells: 500

  # Cell-level train/validation split within each library.
  train_ratio: 0.8
  val_ratio: 0.1

  # Seed used for pseudobulk sampling.
  seed: 42

  # Dirichlet alpha settings for simulated cell-type mixtures.
  # uniform_alpha is used for the balanced block.
  # dominant_alphas creates dominant-cell-type blocks; higher values produce
  # more concentrated dominant proportions.
  uniform_alpha: 1
  dominant_alphas: [50, 15, 5]

# Per-library one-vs-rest DEG selection.
degs:
  fdr_rate: 0.1
  num_deg_per_ct: 200

# UNet training hyperparameters.
training:
  batch_size: 64
  epochs: 50
  lr: 1.0e-5
  weight_decay: 0

  # Loss weights.
  coeff_ct_gep: 1
  coeff_prop: 100

  # StepLR scheduler.
  sched_step: 20
  sched_gamma: 0.5

  # Mixed precision training.
  use_amp: true

  # Reproducibility and device defaults.
  seed: 42
  cuda: 0

  # BLUE bulk preprocessing convention:
  # - deg_first: align to DEG/input genes, then libsize-normalize + 1e6 + log2.
  # - all_first: libsize-normalize + 1e6 + log2 over the full input matrix,
  #   then subset to the model input genes.
  preprocess_mode: deg_first

  # Validation split mode:
  # - pseudo: train/validate on generated pseudobulk files.
  # - held_out_patients: split libraries into train/test groups by split_seed.
  split_mode: pseudo
  split_seed: 42

# Prediction defaults.
predict:
  cuda: 0
